spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/template_app}
    username: ${DATABASE_USERNAME:template_user}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:spring-backend-starter}
    expiration: ${JWT_EXPIRATION:1h}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
