services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: template_app
      POSTGRES_USER: template_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/init_env.py first}
    volumes:
      - app-postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U template_user -d template_app']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/template_app
      DATABASE_USERNAME: template_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/init_env.py first}
      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/init_env.py first}
      JWT_ISSUER: ${JWT_ISSUER:-spring-backend-starter}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  app-postgres:
